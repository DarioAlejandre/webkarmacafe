<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2E6CF">
<title>Karma Café · Tu reseña</title>
<style>
:root{
  --perg:#F2E6CF; --fondo:#E6D6B6; --papel:#FBF4E4; --espresso:#2A1A12; --suave:#6B5444;
  --tostado:#B8681F; --oro:#D6A02F; --oro-claro:#EBD08E; --linea:#D9C59B; --error:#9C2B1B;
  --serif:"Rockwell","Cooper Black",Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0}
body{background:var(--fondo);color:var(--espresso);font:1rem/1.5 var(--sans);-webkit-text-size-adjust:100%}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--perg);overflow:hidden;
  padding:0 20px calc(40px + env(safe-area-inset-bottom,0px));box-shadow:0 0 40px rgba(42,26,18,.15)}
header{position:relative;padding:calc(32px + env(safe-area-inset-top,0px)) 0 24px}
.logo{display:block;width:230px;max-width:75%;height:auto;margin:0 auto 10px}
.lema{position:relative;color:var(--tostado);font-weight:700;margin-top:4px;text-align:center}
.invita{position:relative;font-size:1.1rem;margin:12px auto 0;max-width:28ch;text-align:center}
h2{font:700 1.25rem/1.2 var(--serif);margin-bottom:14px}
fieldset{border:0;padding:0;min-width:0}
legend,label.t{font-weight:700;font-size:.95rem;display:block;margin-bottom:8px;padding:0}
.campo{margin-top:24px}

/* Carrusel destacadas */
.carrusel-wrap{margin:0 -20px 24px;background:var(--papel);border:1.5px solid var(--linea);border-radius:16px;padding:24px 20px 22px;position:relative;min-height:170px}
.carrusel-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px}
.carrusel-badge{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--tostado);display:flex;align-items:center;gap:5px}
.carrusel-dots{display:flex;gap:5px}
.carrusel-dots button{width:7px;height:7px;border-radius:999px;border:0;padding:0;background:var(--linea);cursor:pointer;transition:width .25s,background .25s}
.carrusel-dots button.act{width:18px;background:var(--tostado)}
.carrusel-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.carrusel-track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;width:100%;scroll-snap-align:start;padding-right:2px}
.slide-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.slide-user{display:flex;align-items:center;gap:8px;min-width:0}
.slide-av{flex:none;width:34px;height:34px;border-radius:50%;background:var(--tostado);color:var(--papel);display:grid;place-items:center;font:700 .9rem var(--serif);overflow:hidden}
.slide-av img{width:100%;height:100%;object-fit:cover}
.slide-name{font-weight:700;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slide-mini{display:flex;gap:1px;flex:none}
.slide-mini span{width:18px;height:18px}
.slide-txt{font-size:1rem;line-height:1.5;color:var(--espresso);overflow-wrap:anywhere}

/* Granos */
#granos{display:flex;gap:4px}
#granos.sacude{animation:sacude .4s}
.g{flex:1;position:relative;height:64px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.g input{position:absolute;opacity:0;inset:0;cursor:pointer}
.g svg,.mini svg{width:100%;height:100%;overflow:visible}
.b{fill:transparent;stroke:#B9A47D;stroke-width:2.2;transition:fill .25s,stroke .25s;transition-delay:calc(var(--i)*45ms)}
.c{fill:none;stroke:#B9A47D;stroke-width:2.6;stroke-linecap:round;transition:stroke .25s;transition-delay:calc(var(--i)*45ms)}
.on .b{fill:var(--oro);stroke:var(--espresso)}
.on .c{stroke:var(--espresso)}
.g.on svg{animation:pop .4s calc(var(--i)*45ms) both}
.g:has(input:focus-visible){outline:3px solid var(--tostado);outline-offset:2px;border-radius:12px}
#etiqueta{min-height:2rem;margin-top:8px;font:700 1.2rem/1.3 var(--serif);color:var(--tostado)}

/* Campos */
input[type=text],textarea{width:100%;font:inherit;font-size:1rem;color:var(--espresso);background:var(--papel);
  border:2px solid var(--linea);border-radius:14px;padding:14px 16px;min-height:52px}
textarea{resize:none;height:120px;line-height:1.45}
input::placeholder,textarea::placeholder{color:#8A745F}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--tostado);box-shadow:0 0 0 3px rgba(184,104,31,.25)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer}
.chip span{display:flex;align-items:center;min-height:48px;padding:0 18px;border-radius:999px;font-weight:600;
  border:2px solid var(--linea);background:var(--papel);transition:background .15s,border-color .15s}
.chip input:checked+span{background:var(--oro-claro);border-color:var(--espresso)}
.chip input:focus-visible+span{outline:3px solid var(--tostado);outline-offset:2px}
.foto-campo{display:flex;align-items:center;gap:12px}
.foto-preview{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--linea);background:var(--papel)}
.foto-preview[hidden]{display:none}
.foto-input{position:absolute;width:1px;height:1px;opacity:0}
.foto-btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:999px;
  border:2px solid var(--linea);background:var(--papel);font-weight:600;cursor:pointer}
.foto-input:focus-visible+.foto-btn{outline:3px solid var(--tostado);outline-offset:2px}
.foto-quitar{border:0;background:transparent;color:var(--suave);font-weight:700;cursor:pointer;text-decoration:underline}
.foto-quitar[hidden]{display:none}
.cont{text-align:right;font-size:.85rem;color:var(--suave);margin-top:6px}
.cont.lim{color:var(--error);font-weight:700}
.err{color:var(--error);font-weight:600;margin-top:16px}
.err[hidden]{display:none}
button.pub{width:100%;min-height:60px;margin-top:20px;border:0;border-radius:16px;background:var(--espresso);
  color:var(--perg);font:700 1.15rem var(--sans);cursor:pointer;box-shadow:0 4px 0 var(--tostado);transition:transform .1s,box-shadow .1s}
button.pub:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tostado)}
button.pub:disabled{opacity:.7}
button.pub:focus-visible{outline:3px solid var(--oro);outline-offset:3px}

/* Feed */
#feedSec{margin-top:44px;padding-top:28px;border-top:2px dashed var(--linea)}
.r{background:var(--papel);border-radius:16px;padding:16px;margin-bottom:14px;border:1px solid var(--linea)}
.r.nueva{animation:resalta 2.4s ease-out}
.rh{display:flex;align-items:center;gap:12px}
.av{flex:none;width:42px;height:42px;border-radius:50%;background:var(--tostado);color:var(--papel);
  display:grid;place-items:center;font:700 1.1rem var(--serif)}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.rh div{min-width:0}
.n{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rh small{color:var(--suave)}
.fila{display:flex;align-items:center;gap:10px;margin:12px 0 8px;flex-wrap:wrap}
.mini{display:flex;gap:2px}
.mini span{width:22px;height:22px}
.tx{overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);
  background:var(--espresso);color:var(--perg);padding:14px 22px;border-radius:14px;font-weight:600;opacity:0;
  pointer-events:none;transition:.3s;width:max-content;max-width:calc(100% - 40px);text-align:center}
.toast.v{opacity:1;transform:translate(-50%,0)}

@keyframes pop{0%{transform:scale(.7) rotate(-12deg)}60%{transform:scale(1.25) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
@keyframes sacude{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
@keyframes resalta{from{background:var(--oro-claro)}to{background:var(--papel)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

    <p class="lema">De productores a tu taza</p>
    <p class="invita">Cuéntanos cómo estuvo tu café</p>
  </header>

  <section class="carrusel-wrap" id="carruselSec" aria-label="Reseñas destacadas" hidden>
    <div class="carrusel-top">
      <span class="carrusel-badge"> Reseñas recientes...</span>
      <div class="carrusel-dots" id="carruselDots" role="tablist" aria-label="Seleccionar reseña destacada"></div>
    </div>
    <div class="carrusel-track" id="carruselTrack"></div>
  </section>

  <form id="f" novalidate autocomplete="off">
    <fieldset>
      <legend>Tu calificación</legend>
      <div id="granos" role="radiogroup" aria-label="Calificación de 1 a 5 granos"></div>
      <p id="etiqueta" aria-live="polite">Toca un grano para calificar</p>
    </fieldset>

    <div class="campo">
      <label class="t" for="nombre">Tu nombre</label>
      <input type="text" id="nombre" maxlength="40" placeholder="Tu nombre o @instagram (opcional)" autocapitalize="words">
    </div>

    <div class="campo">
      <label class="t" for="foto">Foto de perfil <span style="font-weight:400;color:var(--suave)"> (opcional)</span></label>
      <div class="foto-campo">
        <img class="foto-preview" id="fotoPreview" alt="Vista previa de la foto" hidden>
        <input class="foto-input" type="file" id="foto" accept="image/*">
        <label class="foto-btn" for="foto">Elegir foto</label>
        <button class="foto-quitar" type="button" id="fotoQuitar" hidden>Quitar</button>
      </div>
    </div>

    <div class="campo">
      <label class="t" for="texto">Tu reseña</label>
      <textarea id="texto" maxlength="200" placeholder="¿A qué te supo? ¿Cómo lo preparaste?"></textarea>
      <div class="cont" id="cont">0/200</div>
    </div>

    <p class="err" id="err" role="alert" hidden>Elige de 1 a 5 granos para publicar tu reseña.</p>
    <button class="pub" type="submit" id="btn">Publicar reseña</button>
  </form>

  <section id="feedSec" aria-labelledby="ft">
    <h2 id="ft">Reseñas recientes</h2>
    <div id="feed"></div>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
const ETIQUETAS = ['', 'No es lo mío', 'Aceptable, puede mejorar', 'Buen café', 'Excelente taza', 'Mi café favorito'];
const LS_KEY = 'karmaCafe.resenas';
const $ = s => document.querySelector(s);
const DIA = 864e5;
let fotoPerfil = '';

const EJEMPLOS = [
  {nombre:'Jorge C.', granos:5, comentario:'Lo preparé en prensa francesa y sabe achocolatado con la acidez justa. Ya pedí otra bolsa para regalar.', fecha:Date.now()-2*DIA},
  {nombre:'@monsee588', granos:4, comentario:'Lo probé en la degustacion de Xiguela y el café estuvo buenísimo. Me quedé con ganas de llevarme una bolsa.', fecha:Date.now()-5*DIA},
  {nombre:'Liliana A.', granos:4, comentario:'Rico y suave. En espresso le faltó un poco de cuerpo, pero en filtrado me encantó.', fecha:Date.now()-9*DIA}
];

// Grano de café en SVG (elipse inclinada con surco en S)
const grano = () => '<svg viewBox="0 0 48 48" aria-hidden="true"><g transform="rotate(35 24 24)"><ellipse class="b" cx="24" cy="24" rx="13" ry="19"/><path class="c" d="M24 7C16 16 32 30 24 41"/></g></svg>';

// ----- Selector de granos -----
const grupo = $('#granos');
for (let i = 1; i <= 5; i++) {
  grupo.insertAdjacentHTML('beforeend',
    `<label class="g" style="--i:${i}"><input type="radio" name="granos" value="${i}" aria-label="${i} ${i > 1 ? 'granos' : 'grano'}">${grano()}</label>`);
}
function pintar(n) {
  grupo.querySelectorAll('.g').forEach((l, i) => l.classList.toggle('on', i < n));
  $('#etiqueta').textContent = ETIQUETAS[n] || 'Toca un grano para calificar';
  if (n) $('#err').hidden = true;
}
grupo.addEventListener('change', e => pintar(+e.target.value));

// ----- Contador -----
function contar() {
  const n = $('#texto').value.length;
  $('#cont').textContent = n + '/200';
  $('#cont').classList.toggle('lim', n >= 180);
}
$('#texto').addEventListener('input', contar);

// ----- Foto de perfil opcional -----
$('#foto').addEventListener('change', e => {
  const archivo = e.target.files[0];
  if (!archivo) return;
  if (!archivo.type.startsWith('image/')) {
    aviso('Selecciona un archivo de imagen.');
    e.target.value = '';
    return;
  }
  if (archivo.size > 2 * 1024 * 1024) {
    aviso('La foto debe pesar menos de 2 MB.');
    e.target.value = '';
    return;
  }
  const lector = new FileReader();
  lector.onload = () => {
    const imagen = new Image();
    imagen.onload = () => {
      const canvas = document.createElement('canvas');
      const tamaño = 256;
      canvas.width = tamaño;
      canvas.height = tamaño;
      const ctx = canvas.getContext('2d');
      const escala = Math.max(tamaño / imagen.width, tamaño / imagen.height);
      const ancho = imagen.width * escala;
      const alto = imagen.height * escala;
      ctx.drawImage(imagen, (tamaño - ancho) / 2, (tamaño - alto) / 2, ancho, alto);
      fotoPerfil = canvas.toDataURL('image/jpeg', 0.82);
      const preview = $('#fotoPreview');
      preview.src = fotoPerfil;
      preview.hidden = false;
      $('#fotoQuitar').hidden = false;
    };
    imagen.src = lector.result;
  };
  lector.readAsDataURL(archivo);
});
$('#fotoQuitar').addEventListener('click', () => {
  fotoPerfil = '';
  $('#foto').value = '';
  const preview = $('#fotoPreview');
  preview.removeAttribute('src');
  preview.hidden = true;
  $('#fotoQuitar').hidden = true;
});

// ----- Feed -----
function hace(ts) {
  const m = Math.round((Date.now() - ts) / 6e4);
  if (m < 1) return 'Justo ahora';
  if (m < 60) return `Hace ${m} min`;
  const h = Math.round(m / 60);
  if (h < 24) return `Hace ${h} h`;
  const d = Math.round(h / 24);
  return d === 1 ? 'Ayer' : `Hace ${d} días`;
}
function tarjeta(r, nueva) {
  const el = document.createElement('article');
  el.className = 'r' + (nueva ? ' nueva' : '');
  let g = '';
  for (let i = 1; i <= 5; i++) g += `<span class="${i <= r.granos ? 'on' : ''}" style="--i:0">${grano()}</span>`;
  el.innerHTML = `<div class="rh"><span class="av"></span><div><strong class="n"></strong><small></small></div></div>
    <div class="fila"><div class="mini" role="img" aria-label="${r.granos} de 5 granos">${g}</div></div>
    <p class="tx"></p>`;
  const av = el.querySelector('.av');
  if (r.foto) {
    const img = document.createElement('img');
    img.src = r.foto;
    img.alt = '';
    av.appendChild(img);
  } else {
    av.textContent = r.nombre.replace('@', '').charAt(0).toUpperCase();
  }
  el.querySelector('.n').textContent = r.nombre;
  el.querySelector('small').textContent = hace(r.fecha);
  const tx = el.querySelector('.tx');
  r.comentario ? tx.textContent = r.comentario : tx.remove();
  return el;
}
function leerLocal() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; } catch (e) { return []; }
}
function guardarLocal(r) {
  try {
    const actuales = leerLocal().filter(x => !(x.fecha === r.fecha && x.comentario === r.comentario));
    localStorage.setItem(LS_KEY, JSON.stringify([r, ...actuales].slice(0, 50)));
  } catch (e) {}
}

// ----- Carrusel de mejores reseñas (4 y 5 granos) -----
let slideIdx = 0;
let carruselTimer = null;
let carruselPausado = false;
let listaResenasActual = [...leerLocal(), ...EJEMPLOS];

function obtenerDestacadas(lista = listaResenasActual) {
  return lista
    .filter(r => r.granos >= 4 && r.comentario && r.comentario.trim().length > 0)
    .sort((a, b) => b.granos - a.granos || b.fecha - a.fecha)
    .slice(0, 6);
}

function renderCarrusel(lista = listaResenasActual) {
  const destacadas = obtenerDestacadas(lista);
  const sec = $('#carruselSec');
  const track = $('#carruselTrack');
  const dots = $('#carruselDots');
  if (!destacadas.length) {
    sec.hidden = true;
    return;
  }
  sec.hidden = false;
  track.innerHTML = '';
  dots.innerHTML = '';
  destacadas.forEach((r, idx) => {
    const slide = document.createElement('article');
    slide.className = 'slide';
    let g = '';
    for (let i = 1; i <= 5; i++) g += `<span class="${i <= r.granos ? 'on' : ''}" style="--i:0">${grano()}</span>`;
    slide.innerHTML = `<div class="slide-head">
        <div class="slide-user">
          <span class="slide-av"></span>
          <span class="slide-name"></span>
        </div>
        <div class="slide-mini" role="img" aria-label="${r.granos} de 5 granos">${g}</div>
      </div>
      <p class="slide-txt"></p>`;
    const av = slide.querySelector('.slide-av');
    if (r.foto) {
      const img = document.createElement('img');
      img.src = r.foto;
      img.alt = '';
      av.appendChild(img);
    } else {
      av.textContent = r.nombre.replace('@', '').charAt(0).toUpperCase();
    }
    slide.querySelector('.slide-name').textContent = r.nombre;
    slide.querySelector('.slide-txt').textContent = `"${r.comentario}"`;
    track.appendChild(slide);

    const dot = document.createElement('button');
    dot.type = 'button';
    dot.setAttribute('aria-label', `Ver reseña destacada ${idx + 1}`);
    if (idx === 0) dot.classList.add('act');
    dot.addEventListener('click', () => irASlide(idx));
    dots.appendChild(dot);
  });
  slideIdx = 0;
  track.scrollLeft = 0;
  iniciarCarrusel();
}

function actualizarDots(idx) {
  slideIdx = idx;
  $('#carruselDots').querySelectorAll('button').forEach((b, i) => b.classList.toggle('act', i === idx));
}

function irASlide(idx) {
  const track = $('#carruselTrack');
  const total = track.children.length;
  if (!total) return;
  const destino = (idx + total) % total;
  track.scrollTo({ left: destino * track.clientWidth, behavior: 'smooth' });
  actualizarDots(destino);
}

function iniciarCarrusel() {
  clearInterval(carruselTimer);
  const track = $('#carruselTrack');
  if (track.children.length <= 1) return;
  carruselTimer = setInterval(() => {
    if (!carruselPausado) irASlide(slideIdx + 1);
  }, 4200);
}

const trackEl = $('#carruselTrack');
trackEl.addEventListener('scroll', () => {
  if (!trackEl.clientWidth) return;
  const idx = Math.round(trackEl.scrollLeft / trackEl.clientWidth);
  if (idx !== slideIdx && idx >= 0 && idx < trackEl.children.length) {
    actualizarDots(idx);
  }
}, { passive: true });
trackEl.addEventListener('touchstart', () => { carruselPausado = true; }, { passive: true });
trackEl.addEventListener('touchend', () => { setTimeout(() => { carruselPausado = false; }, 3500); }, { passive: true });
trackEl.addEventListener('mouseenter', () => { carruselPausado = true; });
trackEl.addEventListener('mouseleave', () => { carruselPausado = false; });

function pintarTodo(lista) {
  listaResenasActual = lista;
  renderCarrusel(lista);
  const feed = $('#feed');
  feed.innerHTML = '';
  lista.forEach(r => feed.append(tarjeta(r)));
}

// Render inicial inmediato con caché local mientras responde Supabase
pintarTodo([...leerLocal(), ...EJEMPLOS]);

// ----- Conexión con Supabase + respaldo en localStorage -----
async function enviarResena(resena) {
  try {
    if (typeof window.guardarResenaDB === 'function') {
      const guardada = await window.guardarResenaDB(resena);
      guardarLocal(guardada || resena);
      return guardada || resena;
    }
  } catch (err) {
    console.warn('Error guardando en Supabase, usando respaldo local:', err);
  }
  guardarLocal(resena);
  return resena;
}

window.inicializarResenas = async function() {
  let remotas = [];
  try {
    if (typeof window.cargarResenasDB === 'function') {
      remotas = await window.cargarResenasDB();
    }
  } catch (err) {
    console.warn('No se pudieron cargar reseñas de Supabase:', err);
    return;
  }

  const locales = leerLocal();
  const localesPendientes = locales.filter(
    loc => !remotas.some(rem => rem.fecha === loc.fecha && rem.comentario === loc.comentario)
  );

  const base = remotas.length
    ? [...localesPendientes, ...remotas]
    : [...localesPendientes, ...EJEMPLOS];

  pintarTodo(base);
};

$('#f').addEventListener('submit', async e => {

    $('#err').hidden = false;

    grupo.scrollIntoView({behavior: 'smooth', block: 'center'});

  }
  const resena = {

    foto: fotoPerfil,
    granos,
    comentario: $('#texto').value.trim(),
    fecha: Date.now()
  };
  const btn = $('#btn');
  btn.disabled = true; btn.textContent = 'Publicando…';
  try {
    const publicada = await enviarResena(resena);
    listaResenasActual = [publicada, ...listaResenasActual];
    renderCarrusel(listaResenasActual);
    const el = tarjeta(publicada, true);
    $('#feed').prepend(el);
    e.target.reset(); pintar(0); contar();
    fotoPerfil = '';
    $('#fotoPreview').removeAttribute('src');
    $('#fotoPreview').hidden = true;
    $('#fotoQuitar').hidden = true;
    el.scrollIntoView({behavior: 'smooth', block: 'center'});
    aviso('¡Gracias! Tu reseña ya está publicada.');
  } catch (err) {
    aviso('No pudimos publicar tu reseña. Intenta de nuevo.');
  } finally {
    btn.disabled = false; btn.textContent = 'Publicar reseña';
  }
});
